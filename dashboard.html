<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    font-family: system-ui, sans-serif; 
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
    color: #e2e8f0; 
    min-height: 100vh;
  }
  
  .login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  
  .login-box {
    background: #1e293b;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 400px;
    border: 1px solid #334155;
  }
  
  .login-box h1 {
    color: #22d3ee;
    margin-bottom: 30px;
    text-align: center;
    font-size: 28px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #cbd5e1;
  }
  
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    transition: border-color 0.3s;
  }
  
  input[type="text"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: #22d3ee;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
  }
  
  .login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(34, 211, 238, 0.3);
  }
  
  .login-btn:active {
    transform: translateY(0);
  }
  
  /* Dashboard Styles */
  .dashboard-container {
    display: none;
    min-height: 100vh;
    padding: 20px;
  }
  
  .dashboard-container.active {
    display: block;
  }
  
  .navbar {
    background: #1e293b;
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #334155;
  }
  
  .navbar-brand {
    color: #22d3ee;
    font-size: 20px;
    font-weight: 600;
  }
  
  .navbar-right {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  
  .username-display {
    color: #cbd5e1;
    font-size: 16px;
  }
  
  .username-highlight {
    color: #4ade80;
    font-weight: 600;
  }
  
  .logout-btn {
    padding: 8px 16px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  
  .logout-btn:hover {
    background: #dc2626;
  }
  
  .main-container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .dashboard-header {
    margin-bottom: 30px;
  }
  
  .dashboard-header h1 {
    color: #22d3ee;
    font-size: 32px;
    margin-bottom: 8px;
  }
  
  .dashboard-header p {
    color: #94a3b8;
    font-size: 16px;
  }
  
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  
  .card {
    background: #1e293b;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #334155;
    transition: transform 0.2s, border-color 0.2s;
  }
  
  .card:hover {
    transform: translateY(-4px);
    border-color: #22d3ee;
  }
  
  .card-title {
    color: #22d3ee;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  
  .card-content {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.6;
  }
  
  .stat-value {
    color: #4ade80;
    font-size: 28px;
    font-weight: 700;
    margin: 16px 0;
  }
  
  .predictions-section {
    background: #1e293b;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #334155;
  }
  
  .predictions-section h2 {
    color: #22d3ee;
    margin-bottom: 20px;
  }
  
  .match {
    background: #0f172a;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    border-left: 4px solid #22d3ee;
  }
  
  .teams {
    font-size: 18px;
    font-weight: 600;
    color: #e2e8f0;
  }
  
  .prediction {
    color: #4ade80;
    margin-top: 8px;
    font-weight: 600;
  }
  
  .confidence {
    font-size: 13px;
    color: #fbbf24;
    margin-top: 6px;
  }
  
  .reason {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<!-- Login Container -->
<div class="login-container" id="loginContainer">
  <div class="login-box">
    <h1>Football Predictions</h1>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter your username"
          required
        >
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
          required
        >
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>
</div>

<!-- Dashboard Container -->
<div class="dashboard-container" id="dashboardContainer">
  <nav class="navbar">
    <div class="navbar-brand">⚽ Football Predictions</div>
    <div class="navbar-right">
      <div class="username-display">
        Welcome, <span class="username-highlight" id="userDisplay"></span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="main-container">
    <div class="dashboard-header">
      <h1>Dashboard</h1>
      <p>Your personalized football predictions and statistics</p>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-title">Accuracy Rate</div>
        <div class="stat-value">78%</div>
        <div class="card-content">Based on your recent predictions</div>
      </div>
      <div class="card">
        <div class="card-title">Total Predictions</div>
        <div class="stat-value">145</div>
        <div class="card-content">Successful predictions made</div>
      </div>
      <div class="card">
        <div class="card-title">Winning Streak</div>
        <div class="stat-value">7</div>
        <div class="card-content">Consecutive correct predictions</div>
      </div>
    </div>

    <div class="predictions-section">
      <h2>Today's Predictions</h2>
      <div id="predictionsList"></div>
    </div>
  </div>
</div>

<script>
// Predictions data
const predictions = [
  { 
    teams: "Man City vs Arsenal", 
    pick: "Over 2.5 Goals", 
    confidence: "78%", 
    reason: "Both teams averaging 2+ goals per game"
  },
  { 
    teams: "Real Madrid vs Barcelona", 
    pick: "BTTS - Yes", 
    confidence: "65%", 
    reason: "High scoring rivalry matches"
  },
  { 
    teams: "Bayern vs Dortmund", 
    pick: "Bayern Win", 
    confidence: "72%", 
    reason: "Home form advantage"
  }
];

// Handle login
function handleLogin(event) {
  event.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  if (username && password) {
    // Store username in localStorage
    localStorage.setItem('currentUser', username);
    
    // Show dashboard, hide login
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('dashboardContainer').classList.add('active');
    
    // Display username
    document.getElementById('userDisplay').textContent = username;
    
    // Load predictions
    loadPredictions();
    
    // Clear form
    document.getElementById('loginForm').reset();
  }
}

// Handle logout
function handleLogout() {
  localStorage.removeItem('currentUser');
  document.getElementById('dashboardContainer').classList.remove('active');
  document.getElementById('loginContainer').style.display = 'flex';
  document.getElementById('loginForm').reset();
  document.getElementById('username').focus();
}

// Load predictions to dashboard
function loadPredictions() {
  const container = document.getElementById('predictionsList');
  container.innerHTML = '';
  
  predictions.forEach(m => {
    const matchDiv = document.createElement('div');
    matchDiv.className = 'match';
    matchDiv.innerHTML = `
      <div class="teams">${m.teams}</div>
      <div class="prediction">Pick: ${m.pick}</div>
      <div class="confidence">Confidence: ${m.confidence}</div>
      <div class="reason">${m.reason}</div>
    `;
    container.appendChild(matchDiv);
  });
}

// Check if user is already logged in
window.addEventListener('DOMContentLoaded', function() {
  const currentUser = localStorage.getItem('currentUser');
  if (currentUser) {
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('dashboardContainer').classList.add('active');
    document.getElementById('userDisplay').textContent = currentUser;
    loadPredictions();
  } else {
    document.getElementById('username').focus();
  }
});
</script>

</body>
</html>
