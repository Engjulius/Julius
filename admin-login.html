<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.55);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            padding: 38px;
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-logo h1 {
            font-size: 28px;
            color: #22d3ee;
            margin-bottom: 10px;
        }

        .admin-logo p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-toggle {
            display: flex;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
        }

        .form-toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            background: white;
            color: black;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }

        .form-toggle button.active,
        .form-toggle button:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .form-toggle button:hover {
            transform: translateY(-1px);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 6px;
            font-size: 14px;
            background-color: rgba(83, 102, 102, 0.25);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            color: #fff;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input:focus {
            outline: none;
            border-color: #aab8ff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            color: #ffffff;
            font-weight: 600;
        }

        input:hover {
            outline: none;
            border-color: #aab8ff;
            transform: translateY(-1px);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            background: linear-gradient(150deg, #3656e4 0%, #6f03db 100%);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        #message,
        #admin-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            min-height: 20px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #22d3ee;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #06b6d4;
            text-decoration: underline;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #4ade80;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .security-badge::before {
            content: "🔒";
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ADMIN LOGO -->
        <div class="admin-logo">
            <h1>⚽ Admin Panel</h1>
            <p>Football Predictions Pro - Administrator Access</p>
        </div>

        <!-- FORM TOGGLE -->
        <div class="form-toggle">
            <button class="toggle-btn active" onclick="showForm('admin-login')">Admin Login</button>
            <button class="toggle-btn" onclick="showForm('admin-register')">Register Admin</button>
        </div>

        <!-- ADMIN LOGIN FORM -->
        <form id="admin-login" class="form active">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label for="admin-email">Email</label>
                <input type="email" id="admin-email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" placeholder="••••••••" required>
            </div>
            <button type="submit">Login to Admin Panel</button>
            <div id="message" style="margin-top:15px;"></div>

            <div class="security-badge">
                Secure Administrator Access
            </div>
        </form>

        <!-- ADMIN REGISTER FORM -->
        <form id="admin-register" class="form">
            <h2>Register Admin Account</h2>
            
            <div class="form-group">
                <label for="reg-first-name">First Name</label>
                <input type="text" id="reg-first-name" placeholder="JOHN" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="reg-last-name">Last Name</label>
                <input type="text" id="reg-last-name" placeholder="SMITH" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="reg-admin-email">Email</label>
                <input type="email" id="reg-admin-email" placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="+1 234-567-8900" required>
            </div>

            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Enter secure password" required>
            </div>

            <div class="form-group">
                <label for="reg-confirm-password">Confirm Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Confirm password" required>
            </div>

            <button type="submit">Create Admin Account</button>
            <p style="color: #94a3b8; margin-top: 15px; font-size: 12px; text-align: center;">
                ⚠️ Requires admin approval before account activation
            </p>
            <div id="admin-msg" style="margin-top: 15px;"></div>
        </form>

        <!-- DIVIDER -->
        <div class="divider">
            Or access user dashboard
        </div>

        <!-- BACK LINK -->
        <div class="back-link">
            <a href="index.html">← User Login</a>
        </div>
    </div>

    <script>
        function showForm(formId) {
            document.querySelectorAll('.form').forEach(form => form.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
            event.target.classList.add('active');
        }

        /* ADMIN LOGIN SCRIPT */
        const ADMIN_LOGIN_URL = 'https://script.google.com/macros/s/AKfycbxDjZBrTA1DjZxQPV3QPfMb5jhJSF2qvk3O96hOExG04CGDPUF-5Gm0P8BtmAzMoLOOIg/exec';
        const adminLoginForm = document.getElementById('admin-login');
        const messageDiv = document.getElementById('message');

        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            messageDiv.innerText = 'Verifying admin credentials...';
            messageDiv.style.color = 'aqua';

            try {
                // Check if admin credentials (you can customize this logic)
                const url = `${ADMIN_LOGIN_URL}?type=admin_login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;

                const res = await fetch(url);
                const data = await res.json();

                if (data.status === 'success') {
                    messageDiv.innerText = '✓ Admin login successful! Welcome ' + data.user;
                    messageDiv.style.color = 'green';

                    // Store admin data
                    const adminData = {
                        firstName: data.firstName || (data.user ? data.user.split(' ')[0] : 'Admin'),
                        lastName: data.lastName || (data.user ? data.user.split(' ')[1] : 'User'),
                        email: email,
                        role: 'admin',
                        adminId: data.adminId || null
                    };

                    sessionStorage.setItem('currentUser', JSON.stringify(adminData));
                    localStorage.setItem('currentUser', JSON.stringify(adminData));

                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1500);
                } else if (data.status === 'not_admin') {
                    messageDiv.innerText = '❌ Access Denied: You do not have admin privileges';
                    messageDiv.style.color = '#ef4444';
                } else {
                    messageDiv.innerText = '❌ Invalid admin credentials';
                    messageDiv.style.color = '#ef4444';
                }
            } catch (error) {
                messageDiv.innerText = '❌ Error connecting to server';
                messageDiv.style.color = '#ef4444';
                console.error(error);
            }
        });

        /* ADMIN REGISTRATION SCRIPT */
        const ADMIN_REGISTER_URL = 'https://script.google.com/macros/s/AKfycbxeJXCIFJX5AM43g5o2twnB_dOa0z_MZ62qMg0KLUXRv6xVmdX2GlD0oHHha0OvvGNTEQ/exec';
        const adminRegisterForm = document.getElementById('admin-register');
        const adminMsg = document.getElementById('admin-msg');

        adminRegisterForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                adminMsg.textContent = '❌ Passwords do not match';
                adminMsg.style.color = '#ef4444';
                return;
            }

            adminMsg.style.color = '#94a3b8';
            adminMsg.textContent = 'Submitting admin registration...';

            fetch(ADMIN_REGISTER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: JSON.stringify({
                    type: 'admin_register',
                    firstName: document.getElementById('reg-first-name').value,
                    lastName: document.getElementById('reg-last-name').value,
                    email: document.getElementById('reg-admin-email').value,
                    phone: document.getElementById('reg-phone').value,
                    password: document.getElementById('reg-password').value,
                    role: 'admin'
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        adminMsg.textContent = '✓ Admin registration submitted! Awaiting approval.';
                        adminMsg.style.color = '#4ade80';
                        adminRegisterForm.reset();
                        setTimeout(() => {
                            showForm('admin-login');
                        }, 2000);
                    } else {
                        adminMsg.textContent = '❌ Error: ' + (data.message || 'Registration failed');
                        adminMsg.style.color = '#ef4444';
                    }
                })
                .catch(error => {
                    adminMsg.textContent = '❌ Error: ' + error.message;
                    adminMsg.style.color = '#ef4444';
                });
        });
    </script>
</body>
</html>
